[build-system]
requires = [
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "numpy==2.3.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-rovib"
version = "0.1.0rc8"
description = "Rotational, vibrational and rovibrational contracts for MATRIX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc8",
  "matrix-chem==0.1.0rc8",
  "matrix-numerics==0.1.0rc8",
  "matplotlib>=3.7",
  "numpy>=1.26,<2.4",
  "pandas>=2.0",
  "scipy>=1.10",
  "sympy>=1.12",
]

[project.optional-dependencies]
physical = [
  "matrix-gf==0.1.0rc8",
  "matrix-smith==0.1.0rc8",
  "matrix-zaff==0.1.0rc8",
  "matrix-trinity==0.1.0rc8",
  "matrix-gaussian==0.1.0rc8",
]
adapters = [
  "matrix-gaussian==0.1.0rc8",
  "matrix-qm==0.1.0rc8",
  "matrix-thermo==0.1.0rc8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Audit the LOCK compatibility adapter without changing its physics.
extend-select = ["F"]
