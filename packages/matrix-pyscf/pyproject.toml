[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-pyscf"
version = "0.1.0rc8"
description = "PySCF launch and structured-output adapters for MATRIX"
requires-python = ">=3.11"
dependencies = [
  "matrix-chem==0.1.0rc8",
  "matrix-core==0.1.0rc8",
  "matrix-engines==0.1.0rc8",
  "matrix-qm==0.1.0rc8",
  "numpy>=1.24",
]

[project.optional-dependencies]
runtime = ["pyscf>=2.6"]
dispersion = ["pyscf>=2.6", "dftd3>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]
